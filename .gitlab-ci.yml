# CI del repo ai-agents-guardrails-kit (no confundir con templates/.../security.yml,
# que es el CI que el instalador genera para los PROYECTOS que lo usan).
# Este pipeline valida el kit en sí antes de mergear cambios a stacks.js,
# generate.js o install.js.

stages:
  - test

self-test:
  stage: test
  image: node:20
  # No before_script: the payload has nothing to install. The policy engine
  # runs on Node and vendors its only dependency (js-yaml), so node:20 already
  # has everything both the kit and the installed payload need.
  script:
    - |
      set -e
      echo "== Tests del propio instalador (install.js) =="
      npm test

      echo "== Verificando que RULES.md esté al día =="
      cp RULES.md /tmp/RULES.md.before
      node docs.js
      diff -u /tmp/RULES.md.before RULES.md || {
        echo "RULES.md está desactualizado respecto a generate.js/stacks.js. Corré 'node docs.js' y commiteá el resultado.";
        exit 1;
      }

      for stack in node php java-maven java-gradle python; do
        echo "== Probando stack: $stack =="
        rm -rf /tmp/fixture-$stack && mkdir -p /tmp/fixture-$stack
        case $stack in
          node) echo '{}' > /tmp/fixture-$stack/package.json ;;
          php) echo '{}' > /tmp/fixture-$stack/composer.json ;;
          java-maven) echo '<project></project>' > /tmp/fixture-$stack/pom.xml ;;
          java-gradle) touch /tmp/fixture-$stack/build.gradle ;;
          python) touch /tmp/fixture-$stack/pyproject.toml ;;
        esac
        node install.js --target /tmp/fixture-$stack --agents claude-code --stacks $stack --git-hooks true --yes
        node /tmp/fixture-$stack/.agent-security/test_policy_engine.js
      done
